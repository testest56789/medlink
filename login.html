<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pharmacy System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="h-screen flex items-center justify-center bg-slate-50 p-4">
    <div class="bg-white rounded-[3rem] max-w-md w-full p-12 shadow-2xl border border-slate-100">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center text-4xl text-white font-bold mx-auto mb-6 shadow-lg">P</div>
            <h1 class="text-2xl font-bold text-slate-800">Pharmacy AI System</h1>
            <p class="text-slate-400 text-sm mt-2">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
        </div>
        <form id="loginForm" class="space-y-6">
            <input type="text" id="username" required class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="ชื่อผู้ใช้งาน">
            <input type="password" id="password" required class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="รหัสผ่าน">
            <button type="submit" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-bold text-lg hover:bg-black transition-all shadow-xl">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            
            // บันทึกสถานะการ Login
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('user', username);
            
            Swal.fire({
                icon: 'success',
                title: 'เข้าสู่ระบบสำเร็จ',
                text: 'ยินดีต้อนรับคุณ ' + username,
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                // เปลี่ยนหน้าไปยัง index.html
                window.location.href = 'index.html'; 
            });
        });

        // เช็คว่าถ้า Login ค้างไว้แล้ว ให้ข้ามไปหน้า Dashboard เลย
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
