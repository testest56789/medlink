<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
    </style>
    <script>
        // ตรวจสอบการ Login ก่อนเข้าหน้าตั้งค่า
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="p-6">

    <div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden mt-10">
        <div class="bg-slate-800 p-6">
            <h1 class="text-white text-xl font-bold flex items-center gap-2">
                <span>⚙️</span> Setting (การตั้งค่าระบบ)
            </h1>
        </div>

        <div class="p-8 space-y-8">
            <section>
                <h2 class="text-sm font-bold uppercase tracking-widest border-b pb-2 mb-4 text-slate-400">1. User (ผู้ใช้งาน)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2">ประเภท</label>
                        <select class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option>หมอ</option><option selected>เภสัช</option><option>พยาบาล</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2">แผนก</label>
                        <input type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" value="แผนกเภสัชกรรม">
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-sm font-bold uppercase tracking-widest border-b pb-2 mb-4 text-slate-400">2. AI Setting</h2>
                <div class="space-y-4">
                    <label class="flex items-center cursor-pointer group">
                        <input type="checkbox" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500" checked> 
                        <span class="ml-3 text-sm text-slate-700 group-hover:text-blue-600 transition">คำแนะนำขนาดยาโดย AI</span>
                    </label>
                    <label class="flex items-center cursor-pointer group">
                        <input type="checkbox" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500"> 
                        <span class="ml-3 text-sm text-slate-700 group-hover:text-blue-600 transition">หากไม่ทำตามคำเตือน: บังคับระบุเหตุผล</span>
                    </label>
                </div>
            </section>

            <section>
                <h2 class="text-sm font-bold uppercase tracking-widest border-b pb-2 mb-4 text-slate-400">3. การเชื่อมต่อระบบ</h2>
                <div class="space-y-3">
                    <input type="text" class="block w-full border-b-2 border-slate-200 focus:border-blue-500 outline-none py-2 text-sm transition-colors" placeholder="HIS API URL...">
                </div>
            </section>
        </div>

        <div class="p-6 bg-slate-50 flex justify-between items-center border-t border-slate-100">
            <a href="index.html" class="text-slate-600 font-bold hover:text-blue-600 transition flex items-center gap-2 text-sm">
                <span>⬅️</span> กลับหน้าหลัก
            </a>
            <button onclick="saveSettings()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition">
                บันทึกการตั้งค่า
            </button>
        </div>
    </div>

    <script>
        function saveSettings() {
            Swal.fire({
                icon: 'success',
                title: 'บันทึกสำเร็จ',
                text: 'การตั้งค่าระบบถูกอัปเดตแล้ว',
                timer: 1500,
                showConfirmButton: false
            });
        }
    </script>
</body>
</html>
