<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-3xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
        <div class="bg-blue-600 p-4">
            <h1 class="text-white text-xl font-semibold">Setting (การตั้งค่าระบบ)</h1>
        </div>

        <div class="p-6 space-y-8">
            
            <section>
                <h2 class="text-lg font-bold border-b pb-2 mb-4 text-gray-700">1. User (ผู้ใช้งาน)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">ประเภท</label>
                        <select class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border">
                            <option>หมอ</option>
                            <option>เภสัช</option>
                            <option>พยาบาล</option>
                            <option>ผู้ดูแล</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">แผนก</label>
                        <input type="text" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" placeholder="ระบุแผนก...">
                    </div>
                </div>
                <div class="mt-4">
                    <span class="block text-sm font-medium text-gray-600 mb-2">การอนุญาตสั่งยา</span>
                    <div class="flex gap-4">
                        <label class="inline-flex items-center"><input type="checkbox" class="rounded text-blue-600"> <span class="ml-2">สั่งยาได้</span></label>
                        <label class="inline-flex items-center"><input type="checkbox" class="rounded text-blue-600"> <span class="ml-2">แก้ไข</span></label>
                        <label class="inline-flex items-center"><input type="checkbox" class="rounded text-blue-600"> <span class="ml-2">Approve ยา</span></label>
                    </div>
                </div>
                <div class="mt-4">
                    <span class="block text-sm font-medium text-gray-600 mb-2">Account Status</span>
                    <div class="flex gap-4">
                        <label class="inline-flex items-center text-green-600 font-medium"><input type="radio" name="status" class="text-green-600"> <span class="ml-2">Active</span></label>
                        <label class="inline-flex items-center text-red-600 font-medium"><input type="radio" name="status" class="text-red-600"> <span class="ml-2">Locked</span></label>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-bold border-b pb-2 mb-4 text-gray-700">2. AI Setting</h2>
                <div class="space-y-4">
                    <div>
                        <span class="block text-sm font-medium text-gray-600 mb-2">การแจ้งเตือน</span>
                        <div class="flex gap-4">
                            <label class="inline-flex items-center"><input type="radio" name="ai_notif" class="text-blue-600"> <span class="ml-2">All</span></label>
                            <label class="inline-flex items-center"><input type="radio" name="ai_notif" class="text-blue-600"> <span class="ml-2">High Risk Only</span></label>
                        </div>
                    </div>
                    <div>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="rounded text-blue-600">
                            <span class="ml-2 text-sm text-gray-600 font-medium">คำแนะนำขนาดยาโดย AI (ติ๊กคือขึ้น ไม่ติ๊กคือไม่ขึ้น)</span>
                        </label>
                    </div>
                    <div>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="rounded text-blue-600">
                            <span class="ml-2 text-sm text-gray-600 font-medium">หากไม่ทำตามคำเตือน: บังคับระบุเหตุผล</span>
                        </label>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-bold border-b pb-2 mb-4 text-gray-700">3. ความปลอดภัยของข้อมูล</h2>
                <div class="space-y-4">
                    <div>
                        <label class="inline-flex items-center">
                            <input type="checkbox" class="rounded text-blue-600">
                            <span class="ml-2 text-sm text-gray-600 font-medium">การยืนยันตัวตน (เปิดใช้งาน)</span>
                        </label>
                    </div>
                    <div class="bg-gray-100 p-3 rounded-md">
                        <span class="block text-sm font-semibold text-gray-700 mb-2">บันทึกกิจกรรม</span>
                        <div class="space-y-2">
                            <label class="flex items-center"><input type="checkbox" class="rounded text-blue-600"> <span class="ml-2 text-sm">บันทึกการสั่ง และ แก้ไขยา</span></label>
                            <label class="flex items-center"><input type="checkbox" class="rounded text-blue-600"> <span class="ml-2 text-sm">บันทึกการเปิดดูข้อมูลผู้ป่วย</span></label>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-bold border-b pb-2 mb-4 text-gray-700">4. การเชื่อมต่อระบบ</h2>
                <div class="space-y-3">
                    <input type="text" class="block w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-1" placeholder="ระบบเชื่อมต่อ 1...">
                    <input type="text" class="block w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-1" placeholder="ระบบเชื่อมต่อ 2...">
                    <input type="text" class="block w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-1" placeholder="ระบบเชื่อมต่อ 3...">
                </div>
            </section>

        </div>

        <div class="p-6 bg-gray-50 text-right">
            <button class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">บันทึกการตั้งค่า</button>
        </div>
    </div>

</body>
</html>
